[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verificapa"
version = "0.1.0"
description = "Verifica referencias APA 7 contra Crossref y detecta citas inventadas por la IA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fernando Santamaría González", email = "info@iaforteachers.com" }]
keywords = ["apa", "apa7", "crossref", "doi", "referencias", "citations", "hallucination", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/lernys/verificador-apa7_2026"
Issues = "https://github.com/lernys/verificador-apa7_2026/issues"

[project.scripts]
verificapa = "verificapa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verificapa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
